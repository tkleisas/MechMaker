name: docker

# Ships the headless app as a container image:
#   - every push to main  → ghcr.io/<owner>/mechmaker:latest (+ sha tag)
#   - milestone/version tags (M*, v*) → the tag + latest, and a GitHub release.
# The image's own test gate already ran in the `ci` workflow for this commit;
# here the runtime image is built, pushed, and smoke-tested over the HTTP door.

on:
  push:
    branches: [main]
    tags: ['M*', 'v*']

permissions:
  contents: write   # release creation on tags
  packages: write   # ghcr.io push

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — HTTP door serves the tools
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d -p 8080:8080 --name smoke "$TAG" --http
          for i in $(seq 1 20); do
            sleep 1
            RESP=$(curl -sf -X POST http://localhost:8080/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}') && break
          done
          test -n "$RESP" && echo "$RESP" | grep -q "MechMaker.Server" && echo "SMOKE OK" || { docker logs smoke; exit 1; }
          docker rm -f smoke >/dev/null

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Try it:

            ```
            docker run --rm -p 8080:8080 ghcr.io/${{ github.repository }}:${{ github.ref_name }} --http
            # → open http://localhost:8080/ for the viewer, /mcp for agents
            ```
