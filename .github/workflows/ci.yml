name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The portability gate: the full suite (MuJoCo physics, engine, server, OpenCV
  # vision) inside the container. A red run here means the physics or the native
  # interop broke on linux-x64 — see docs/01-analysis.md "The container".
  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Windows path: where the OCR tests genuinely run (the Tesseract wrapper's
  # natives are Windows-only) and the Avalonia/adb side lives.
  windows-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: |
          dotnet test tests/MechMaker.Core.Tests/MechMaker.Core.Tests.csproj
          dotnet test tests/MechMaker.Engine.Tests/MechMaker.Engine.Tests.csproj
          dotnet test tests/MechMaker.Hil.Tests/MechMaker.Hil.Tests.csproj
          dotnet test tests/MechMaker.Server.Tests/MechMaker.Server.Tests.csproj
